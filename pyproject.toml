[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "httper"
version = "0.1.0"
description = "An in-memory orders API with Prometheus metrics"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "prometheus-client>=0.21,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "pytest-asyncio>=0.24,<2", "mypy>=1.13,<2", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
strict = true
files = ["app", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
